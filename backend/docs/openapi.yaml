openapi: 3.0.3
info:
  title: My Talking Shaha Core Garage API
  version: 0.1.0
  description: Authentication, user profile, core garage, vehicle dashboard, vehicle parts, timeline, analytics, and AI chat API for the backend flow.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      summary: Register a new account
      tags: [ Auth ]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created account with the signed-in user and issued token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      summary: Authenticate by email and password
      tags: [ Auth ]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated user with issued token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      summary: Exchange a refresh token for a new token pair
      tags: [ Auth ]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New token pair; the presented refresh token is rotated out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      summary: Invalidate the supplied refresh token
      tags: [ Auth ]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Refresh token invalidated
        '400':
          $ref: '#/components/responses/ValidationError'
  /users/me:
    get:
      summary: Get the profile of the authenticated user
      tags: [ Users ]
      responses:
        '200':
          description: Profile of the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles:
    get:
      summary: List current user's garage vehicles
      tags: [ Vehicles ]
      responses:
        '200':
          description: Vehicles in the current garage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
    post:
      summary: Add vehicle to garage
      tags: [ Vehicles ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
      responses:
        '201':
          description: Created vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/ValidationError'
  /vehicles/brands:
    get:
      summary: List supported vehicle brands
      tags: [ Vehicles ]
      responses:
        '200':
          description: Vehicle brand names sorted alphabetically
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /vehicles/fuel-types:
    get:
      summary: List supported fuel types
      tags: [ Vehicles ]
      responses:
        '200':
          description: Fuel type options for selection lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FuelTypeOption'
  /vehicles/engine-types:
    get:
      summary: List supported engine types
      tags: [ Vehicles ]
      responses:
        '200':
          description: Engine type options for selection lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FuelTypeOption'
  /vehicles/{vehicleId}:
    patch:
      summary: Update vehicle
      tags: [ Vehicles ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - $ref: '#/components/parameters/ChatLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVehicleRequest'
      responses:
        '200':
          description: Updated vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete vehicle with its parts and events
      tags: [ Vehicles ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - $ref: '#/components/parameters/ChatLanguage'
      responses:
        '204':
          description: Vehicle deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/photos:
    post:
      summary: Upload a vehicle photo (JPG or PNG)
      tags: [ Vehicles ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Uploaded photo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiclePhoto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      summary: List vehicle photos
      tags: [ Vehicles ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Vehicle photos ordered by upload time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiclePhotoList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/photos/{photoId}:
    delete:
      summary: Delete a vehicle photo
      tags: [ Vehicles ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - name: photoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Photo deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /photos/{photoId}:
    get:
      summary: Get photo content
      description: >
        Serves the stored photo bytes. Publicly readable because image widgets
        cannot attach the JWT header; access relies on the unguessable random
        photo id in the URL.
      tags: [ Vehicles ]
      security: []
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Photo bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/dashboard:
    get:
      summary: Get vehicle dashboard with parts forecast
      tags: [ Vehicles ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Vehicle dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleDashboard'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/parts:
    get:
      summary: List installed vehicle parts
      tags: [ Parts ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Installed parts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartList'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Add installed vehicle part
      tags: [ Parts ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartRequest'
      responses:
        '201':
          description: Created part with calculated lifetime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Part'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/parts/{partId}:
    patch:
      summary: Update installed vehicle part
      tags: [ Parts ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - name: partId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartRequest'
      responses:
        '200':
          description: Updated part with recalculated lifetime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Part'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/timeline:
    get:
      summary: List vehicle timeline events
      tags: [ Timeline ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - name: type
          in: query
          required: false
          description: Optional filter by event type
          schema:
            $ref: '#/components/schemas/TimelineEventType'
      responses:
        '200':
          description: Timeline events, most recent first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEventList'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/timeline/refuel:
    post:
      summary: Add refuel event
      description: Electric refuel payloads create a RECHARGE event for backwards compatibility.
      tags: [ Timeline ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefuelEventRequest'
      responses:
        '201':
          description: Created refuel event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEvent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/timeline/recharge:
    post:
      summary: Add recharge event
      description: Uses kwh for the charged energy amount, requires fuelType ELECTRIC, and returns a timeline event with type RECHARGE. The legacy liters field is still accepted and returned for current mobile compatibility.
      tags: [ Timeline ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefuelEventRequest'
      responses:
        '201':
          description: Created recharge event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEvent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/timeline/trip:
    post:
      summary: Add trip event
      tags: [ Timeline ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripEventRequest'
      responses:
        '201':
          description: Created trip event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEvent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/timeline/maintenance:
    post:
      summary: Add maintenance event
      description: >
        Multipart request. The event fields go in a JSON part named `event`; optional JPG/PNG
        image parts named `photos` are stored server-side and returned as content URLs in the
        event's `photoUrls`.
      tags: [ Timeline ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ event ]
              properties:
                event:
                  $ref: '#/components/schemas/CreateMaintenanceEventRequest'
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
            encoding:
              event:
                contentType: application/json
              photos:
                contentType: image/jpeg, image/png
      responses:
        '201':
          description: Created maintenance event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEvent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/timeline/part:
    post:
      summary: Add part replacement event
      tags: [ Timeline ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartEventRequest'
      responses:
        '201':
          description: Created part replacement event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEvent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/timeline/{eventId}:
    patch:
      summary: Update timeline event
      description: >
        Updates a timeline event using the same event-specific fields and validation
        as the matching add endpoint. The event type is determined by the stored
        event and cannot be changed.
      tags: [ Timeline ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreateRefuelEventRequest'
                - $ref: '#/components/schemas/CreateTripEventRequest'
                - $ref: '#/components/schemas/CreateMaintenanceEventRequest'
                - $ref: '#/components/schemas/CreatePartEventRequest'
      responses:
        '200':
          description: Updated timeline event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEvent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete timeline event
      tags: [ Timeline ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '204':
          description: Event deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/analytics:
    get:
      summary: Get analytics overview
      tags: [ Analytics ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - name: period
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AnalyticsPeriod'
        - name: startDate
          in: query
          required: false
          description: Inclusive custom range start date. Must be provided with endDate.
          schema:
            type: string
            format: date
            example: '2026-01-01'
        - name: endDate
          in: query
          required: false
          description: Inclusive custom range end date. Must be provided with startDate.
          schema:
            type: string
            format: date
            example: '2026-06-30'
      responses:
        '200':
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/analytics/mileage-trend:
    get:
      summary: Get mileage trend
      description: Returns accumulated mileage points aggregated for the selected year or a selected month in that year.
      tags: [ Analytics ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 1900
            example: 2026
        - name: month
          in: query
          required: false
          description: Calendar month number. Omit to return the yearly trend grouped by month.
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 6
      responses:
        '200':
          description: Mileage trend for chart rendering
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MileageTrend'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/chat:
    get:
      summary: Get AI chat state
      description: Returns the vehicle-scoped chat session, previous messages, and three quick questions.
      tags: [ Chat ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - $ref: '#/components/parameters/ChatLanguage'
      responses:
        '200':
          description: Chat state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatState'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/chat/messages:
    get:
      summary: Get AI chat message history
      tags: [ Chat ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - $ref: '#/components/parameters/ChatLanguage'
      responses:
        '200':
          description: Chat messages, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessages'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Send message to AI chat
      description: >-
        Stores the user message, classifies the natural-language intent, generates a grounded assistant
        answer, and returns a validated frontend action when a form or screen should be opened.
      tags: [ Chat ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
      responses:
        '201':
          description: User and assistant messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendChatMessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/chat/trips/start:
    post:
      summary: Start a trip from chat
      tags: [ Chat, Trips ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStartRequest'
      responses:
        '201':
          description: Started trip saved as an in-progress timeline event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripLifecycleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/chat/trips/{tripId}/end:
    post:
      summary: End a chat-started trip
      tags: [ Chat, Trips ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripEndRequest'
      responses:
        '200':
          description: Finished trip with missing required fields, if any
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripLifecycleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicles/{vehicleId}/chat/trips/{tripId}/data:
    post:
      summary: Extract and save trip data from natural language
      tags: [ Chat, Trips ]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripDataCollectionRequest'
      responses:
        '200':
          description: Extracted values and updated trip state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripLifecycleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChatLanguage:
      name: language
      in: query
      required: false
      description: Controls the initial assistant message and fallback quick questions.
      schema:
        type: string
        enum: [ EN, RU ]
        default: EN
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Resource belongs to another user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Access token is missing or invalid, or credentials are invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Email already registered
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      required: [ code, message, fields ]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request contains invalid fields
        fields:
          type: object
          additionalProperties:
            type: string
    RegisterRequest:
      type: object
      required: [ email, password, displayName ]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: user@example.com
        password:
          type: string
          minLength: 6
          maxLength: 72
          description: 6-72 characters; letters (a-z, A-Z), digits, and ()[]$#*-_?!.%+<>/
          example: secret123
        displayName:
          type: string
          maxLength: 120
          example: Test User
    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: secret123
    RefreshTokenRequest:
      type: object
      required: [ refreshToken ]
      properties:
        refreshToken:
          type: string
    AuthResponse:
      type: object
      required: [ user, accessToken, refreshToken ]
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        accessToken:
          type: string
        refreshToken:
          type: string
    TokenResponse:
      type: object
      required: [ accessToken, refreshToken ]
