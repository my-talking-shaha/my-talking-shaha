        refreshToken:
          type: string
    UserResponse:
      type: object
      required: [ id, email, displayName ]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
    CreateVehicleRequest:
      type: object
      required: [ brand, model, productionYear, mileageKm, fuelType ]
      properties:
        brand:
          type: string
          maxLength: 80
        model:
          type: string
          maxLength: 120
        productionYear:
          type: integer
          minimum: 1900
          maximum: 2026
        color:
          type: string
          maxLength: 40
        mileageKm:
          type: integer
          minimum: 0
        fuelType:
          $ref: '#/components/schemas/FuelType'
        engineDescription:
          type: string
          maxLength: 80
        vin:
          type: string
          minLength: 17
          maxLength: 17
    Vehicle:
      allOf:
        - $ref: '#/components/schemas/CreateVehicleRequest'
        - type: object
          required: [ id ]
          properties:
            id:
              type: string
              format: uuid
            photoUrl:
              type: string
              nullable: true
              readOnly: true
              description: Public URL of the first uploaded vehicle photo, if any.
    VehicleDashboard:
      type: object
      required: [ vehicle, maintenanceForecast, recentEvents ]
      properties:
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        maintenanceForecast:
          $ref: '#/components/schemas/MaintenanceForecast'
        recentEvents:
          type: array
          items:
            $ref: '#/components/schemas/RecentEvent'
    MaintenanceForecast:
      type: object
      required: [ overallStatus, updatedAt, parts ]
      properties:
        overallStatus:
          $ref: '#/components/schemas/PartStatus'
        nextServiceInKm:
          type: integer
          nullable: true
        updatedAt:
          type: string
          format: date-time
        parts:
          type: array
          items:
            $ref: '#/components/schemas/Part'
    RecentEvent:
      type: object
      description: Compact timeline event shown on the dashboard.
      required: [ id, type, eventDateTime ]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TimelineEventType'
        title:
          type: string
          nullable: true
        subtitle:
          type: string
          nullable: true
        eventDateTime:
          type: string
          format: date-time
    PartList:
      type: object
      required: [ parts ]
      properties:
        parts:
          type: array
          items:
            $ref: '#/components/schemas/Part'
    CreatePartRequest:
      type: object
      required: [ name, category, installedAt, installedMileageKm ]
      properties:
        name:
          type: string
          maxLength: 255
        category:
          $ref: '#/components/schemas/PartCategory'
        installedAt:
          type: string
          format: date
        installedMileageKm:
          type: integer
          minimum: 0
        expectedLifetimeKm:
          type: integer
          minimum: 1
          nullable: true
        description:
          type: string
          maxLength: 2000
          nullable: true
        cost:
          type: number
          minimum: 0
          exclusiveMinimum: true
          nullable: true
        photoUrls:
          type: array
          nullable: true
          items:
            type: string
    UpdatePartRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        category:
          $ref: '#/components/schemas/PartCategory'
        installedAt:
          type: string
          format: date
        installedMileageKm:
          type: integer
          minimum: 0
        expectedLifetimeKm:
          type: integer
          minimum: 1
        description:
          type: string
          maxLength: 2000
        cost:
          type: number
          minimum: 0
          exclusiveMinimum: true
        photoUrls:
          type: array
          nullable: true
          items:
            type: string
    Part:
      type: object
      required: [ id, name, category, installedAt, installedMileageKm, remainingKm, remainingPercent, status ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: '#/components/schemas/PartCategory'
        installedAt:
          type: string
          format: date
        installedMileageKm:
          type: integer
        expectedLifetimeKm:
          type: integer
          nullable: true
        remainingKm:
          type: integer
          nullable: true
        remainingPercent:
          type: integer
          nullable: true
        status:
          $ref: '#/components/schemas/PartStatus'
        description:
          type: string
          nullable: true
        cost:
          type: number
          nullable: true
        photoUrls:
          type: array
          items:
            type: string
    UpdateVehicleRequest:
      type: object
      description: Partial vehicle update; only the provided fields are applied.
      properties:
        brand:
          type: string
          maxLength: 80
        model:
          type: string
          maxLength: 120
        productionYear:
          type: integer
          minimum: 1900
          maximum: 2100
        color:
          type: string
          maxLength: 40
        mileageKm:
          type: integer
          minimum: 0
        fuelType:
          $ref: '#/components/schemas/FuelType'
        engineDescription:
          type: string
          maxLength: 80
        vin:
          type: string
          minLength: 17
          maxLength: 17
    VehiclePhoto:
      type: object
      required: [ photoId, url ]
      properties:
        photoId:
          type: string
          format: uuid
        url:
          type: string
          description: Absolute public URL of the photo content.
    VehiclePhotoList:
      type: object
      required: [ photos ]
      properties:
        photos:
          type: array
          items:
            $ref: '#/components/schemas/VehiclePhoto'
    CreateRefuelEventRequest:
      type: object
      description: Refuel requests require liters. Recharge requests require kwh, while liters is accepted as a legacy alias for current mobile clients.
      required: [ eventDateTime, title, mileageKm, cost, fuelType ]
      properties:
        eventDateTime:
          type: string
          format: date-time
        title:
          type: string
          maxLength: 255
        mileageKm:
          type: integer
          minimum: 0
        liters:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Refuel volume in liters. For recharge requests, this is accepted as a legacy alias for kwh.
        kwh:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 500
          description: Recharge energy in kilowatt-hours. Used when the event type is RECHARGE.
        cost:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Event cost. Recharge requests are limited to 100000.
        fuelType:
          $ref: '#/components/schemas/FuelType'
        fuelName:
          type: string
          nullable: true
        stationName:
          type: string
          nullable: true
    CreateTripEventRequest:
      type: object
      required: [ eventDateTime, title, endMileageKm, durationMinutes ]
      properties:
        eventDateTime:
          type: string
          format: date-time
        title:
          type: string
          maxLength: 255
        startMileageKm:
          type: integer
          minimum: 0
          nullable: true
        endMileageKm:
          type: integer
          minimum: 0
        route:
          type: string
          nullable: true
        durationMinutes:
          type: integer
          minimum: 1
    CreateMaintenanceEventRequest:
      type: object
      required: [ eventDateTime, mileageKm, name ]
      properties:
        eventDateTime:
          type: string
          format: date-time
        mileageKm:
          type: integer
          minimum: 0
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        cost:
          type: number
          minimum: 0
          exclusiveMinimum: true
          nullable: true
    CreatePartEventRequest:
      type: object
      required: [ eventDateTime, mileageKm, name ]
      properties:
        eventDateTime:
          type: string
          format: date-time
        mileageKm:
          type: integer
          minimum: 0
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        cost:
          type: number
          minimum: 0
          exclusiveMinimum: true
          nullable: true
    TimelineEventList:
      type: object
      required: [ events ]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
    TimelineEvent:
      type: object
      description: >-
        Unified timeline event. Fields are populated according to `type`: refuel events
        use liters/fuelType/fuelName/stationName and cost; recharge events use kwh and
        also return legacy liters for current mobile compatibility; trip events use
        startMileageKm/endMileageKm/distanceKm/route/durationMinutes; maintenance events use
        name/description/photoUrls and cost.
      required: [ id, type, eventDateTime ]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TimelineEventType'
        title:
          type: string
          nullable: true
        eventDateTime:
          type: string
          format: date-time
        cost:
          type: number
          nullable: true
        mileageKm:
          type: integer
          nullable: true
        liters:
          type: number
          nullable: true
          description: Refuel volume in liters. For recharge events, this mirrors kwh as a legacy alias.
        kwh:
          type: number
          nullable: true
          description: Recharge energy in kilowatt-hours.
        fuelType:
          allOf:
            - $ref: '#/components/schemas/FuelType'
          nullable: true
        fuelName:
          type: string
          nullable: true
        stationName:
          type: string
          nullable: true
        startMileageKm:
          type: integer
          nullable: true
        endMileageKm:
          type: integer
          nullable: true
        distanceKm:
          type: integer
          nullable: true
        route:
          type: string
          nullable: true
        durationMinutes:
          type: integer
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
        fuelLiters:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
        tripStatus:
          $ref: '#/components/schemas/TripCompletionStatus'
        averageFuelConsumptionLitersPerKm:
          type: number
          nullable: true
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        photoUrls:
          type: array
          nullable: true
          items:
            type: string
    FuelType:
      type: string
      description: >
        Fuel type of a vehicle or a refuel/recharge event. GASOLINE is a legacy generic
        petrol value kept for already stored data; new clients should prefer
        the octane-specific PETROL_* values.
      enum: [ PETROL_92, PETROL_95, PETROL_98, PETROL_100, DIESEL, ELECTRIC, HYBRID, PHEV, GASOLINE, OTHER ]
    FuelTypeOption:
      type: object
      description: A selectable fuel type or engine type option.
      properties:
        code:
          $ref: '#/components/schemas/FuelType'
        label:
          type: string
          example: Petrol (95)
    PartCategory:
      type: string
      enum: [ ENGINE_OIL, OIL_FILTER, AIR_FILTER, BRAKE_PADS, TIMING_BELT, BATTERY, OTHER ]
    PartStatus:
      type: string
      enum: [ OK, ATTENTION, CRITICAL, UNKNOWN, REPLACED ]
    TimelineEventType:
      type: string
      enum: [ TRIP, REFUEL, RECHARGE, REPAIR, MAINTENANCE, PART_REPLACEMENT, WARNING ]
    TripCompletionStatus:
      type: string
      enum: [ IN_PROGRESS, COMPLETE, PARTIAL ]
    AnalyticsPeriod:
      type: string
      enum: [ MONTH, YEAR, ALL_TIME ]
    AnalyticsOverview:
      type: object
      required: [ period, totalExpenses, currency, expensesByCategory, monthlyExpenses, seasonalExpenses, costPerKilometer, fuel, historyAnalysis, hasData ]
      properties:
        period:
          $ref: '#/components/schemas/AnalyticsPeriod'
        totalExpenses:
          type: number
        currency:
          type: string
          example: RUB
        expensesByCategory:
          type: object
          additionalProperties:
            type: number
        monthlyExpenses:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyExpense'
        seasonalExpenses:
          type: array
          items:
            $ref: '#/components/schemas/SeasonalExpense'
        costPerKilometer:
          $ref: '#/components/schemas/CostPerKilometer'
        fuel:
          $ref: '#/components/schemas/FuelAnalytics'
        historyAnalysis:
          $ref: '#/components/schemas/HistoryAnalysis'
        hasData:
          type: boolean
    MileageTrend:
      type: object
      required: [ year, points, hasData ]
      properties:
        year:
          type: integer
          example: 2026
        month:
          type: integer
          nullable: true
          minimum: 1
          maximum: 12
          example: 6
        points:
          type: array
          items:
            $ref: '#/components/schemas/MileageTrendPoint'
        hasData:
          type: boolean
    MileageTrendPoint:
      type: object
      required: [ label, mileageKm ]
      properties:
        label:
          type: string
          description: Short chart label such as "Jan" for yearly trend or "15" for a monthly trend.
          example: Jun 15
        mileageKm:
          type: integer
          description: Accumulated odometer mileage in kilometers at this point.
          example: 143240
    MonthlyExpense:
      type: object
      required: [ month, total, breakdownByCategory ]
      properties:
        month:
          type: string
          example: 2026-06
        total:
          type: number
        breakdownByCategory:
          type: object
          additionalProperties:
            type: number
    SeasonalExpense:
      type: object
      required: [ season, total ]
      properties:
        season:
          type: string
          enum: [ WINTER, SPRING, SUMMER, AUTUMN ]
        total:
          type: number
    CostPerKilometer:
      type: object
      required: [ totalKm, totalExpenses, costPerKm ]
      properties:
        totalKm:
          type: integer
        totalExpenses:
          type: number
        costPerKm:
          type: number
    FuelAnalytics:
      type: object
      required: [ totalLiters, averageConsumptionLitersPer100Km ]
      properties:
        totalLiters:
          type: number
        averageConsumptionLitersPer100Km:
          type: number
    HistoryAnalysis:
      type: object
      required: [ eventCount, refuelCount, tripCount, maintenanceCount, partEventCount, totalTripKm, averageTripKm ]
      properties:
        eventCount:
          type: integer
        refuelCount:
          type: integer
        tripCount:
          type: integer
        maintenanceCount:
          type: integer
        partEventCount:
          type: integer
        totalTripKm:
          type: integer
        averageTripKm:
          type: number
    TripStartRequest:
      type: object
      properties:
        startedAt:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          maxLength: 1000
          nullable: true
          example: Morning commute
    TripEndRequest:
      type: object
      properties:
        endedAt:
          type: string
          format: date-time
          nullable: true
        distanceKm:
          type: integer
          minimum: 0
          nullable: true
          example: 42
        durationMinutes:
          type: integer
          minimum: 1
          nullable: true
          example: 55
        fuelLiters:
          type: number
          minimum: 0
          exclusiveMinimum: true
          nullable: true
          example: 4.2
        notes:
          type: string
          maxLength: 1000
          nullable: true
    TripDataCollectionRequest:
      type: object
      required: [ text ]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          example: We drove 42 km for 55 minutes and used about 4 liters
    TripLifecycleResponse:
      type: object
      required: [ tripId, confirmation, missingRequiredFields, extractedValues, trip ]
      properties:
        tripId:
          type: string
          format: uuid
        confirmation:
          type: string
          example: Trip finished and auto-saved as partial. Send the missing details when you have them.
        missingRequiredFields:
          type: array
          items:
            type: string
            enum: [ distanceKm, fuelLiters, durationMinutes ]
        extractedValues:
          type: object
          additionalProperties: true
          example:
            distanceKm: 42
            durationMinutes: 55
            fuelLiters: 4.2
        trip:
          $ref: '#/components/schemas/TimelineEvent'
    ChatState:
      type: object
      required: [ sessionId, quickQuestions, messages ]
      properties:
        sessionId:
          type: string
          format: uuid
        quickQuestions:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: string
          example:
            - Vehicle status
            - What are my total expenses?
            - What can break soon?
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
    ChatMessages:
      type: object
      required: [ messages ]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
    SendChatMessageRequest:
      type: object
      required: [ text ]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          example: What can break soon?
    SendChatMessageResponse:
      type: object
      required: [ userMessage, assistantMessage ]
      properties:
        userMessage:
          $ref: '#/components/schemas/ChatMessage'
        assistantMessage:
          $ref: '#/components/schemas/ChatMessage'
        createdEvent:
          allOf:
            - $ref: '#/components/schemas/TimelineEvent'
          nullable: true
    ChatMessage:
      type: object
      required: [ id, role, text, createdAt ]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/ChatMessageRole'
        text:
          type: string
        createdAt:
          type: string
          format: date-time
        action:
          allOf:
            - $ref: '#/components/schemas/ChatAction'
          nullable: true
    ChatAction:
      type: object
      description: Frontend action validated by the backend.
      required: [ type, prefill ]
      properties:
        type:
          type: string
          enum: [ OPEN_FORM, OPEN_SCREEN ]
        form:
          type: string
          nullable: true
          enum: [ REFUEL, RECHARGE, TRIP, PART_REPLACEMENT, MAINTENANCE ]
        screen:
          type: string
          nullable: true
          enum: [ ANALYTICS, MAINTENANCE_FORECAST, DASHBOARD, HISTORY_EVENT_EDIT ]
        prefill:
          type: object
          additionalProperties: true
          example:
            eventId: 994v15jc-15d3-4957-9189-u8e79789ea66
            eventType: REFUEL
    ChatMessageRole:
      type: string
      enum: [ USER, ASSISTANT, SYSTEM ]
