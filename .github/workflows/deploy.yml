name: Development deploy

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

concurrency:
  group: development-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to development server
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail

          : "${SERVER_HOST:?SERVER_HOST secret is required}"
          : "${SERVER_SSH_KEY:?SERVER_SSH_KEY secret is required}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "${SERVER_PORT:-22}" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application services
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_APP_PATH: ${{ secrets.SERVER_APP_PATH }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          TIMEWEB_AI_BASE_URL: ${{ secrets.TIMEWEB_AI_BASE_URL }}
          TIMEWEB_AI_TOKEN: ${{ secrets.TIMEWEB_AI_TOKEN }}
          DEPLOY_IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          : "${SERVER_HOST:?SERVER_HOST secret is required}"
          : "${SERVER_USER:?SERVER_USER secret is required}"
          : "${SERVER_APP_PATH:?SERVER_APP_PATH secret is required}"
          : "${JWT_SECRET:?JWT_SECRET secret is required}"
          : "${DB_USERNAME:?DB_USERNAME secret is required}"
          : "${DB_PASSWORD:?DB_PASSWORD secret is required}"
          : "${TIMEWEB_AI_BASE_URL:?TIMEWEB_AI_BASE_URL secret is required}"
          : "${TIMEWEB_AI_TOKEN:?TIMEWEB_AI_TOKEN secret is required}"

          if [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "JWT_SECRET secret must be at least 32 bytes" >&2
            exit 1
          fi

          if [ "$JWT_SECRET" = "dev-secret-change-me-please-32+bytes-minimum-0123456789" ]; then
            echo "JWT_SECRET secret must not use the committed development placeholder" >&2
            exit 1
          fi

          if [ "$DB_USERNAME" = "shaha_user" ] || [ "$DB_PASSWORD" = "shaha_password" ]; then
            echo "DB_USERNAME and DB_PASSWORD secrets must not use committed development defaults" >&2
            exit 1
          fi

          remote_command="$(
            printf 'SERVER_APP_PATH=%q JWT_SECRET=%q DB_USERNAME=%q DB_PASSWORD=%q TIMEWEB_AI_BASE_URL=%q TIMEWEB_AI_TOKEN=%q DEPLOY_IMAGE_TAG=%q bash -s' \
              "$SERVER_APP_PATH" \
              "$JWT_SECRET" \
              "$DB_USERNAME" \
              "$DB_PASSWORD" \
              "$TIMEWEB_AI_BASE_URL" \
              "$TIMEWEB_AI_TOKEN" \
              "$DEPLOY_IMAGE_TAG"
          )"

          ssh -i ~/.ssh/deploy_key \
            -p "${SERVER_PORT:-22}" \
            -o IdentitiesOnly=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "$remote_command" <<'REMOTE'
          set -euo pipefail

          : "${JWT_SECRET:?JWT_SECRET secret is required}"
          : "${DB_USERNAME:?DB_USERNAME secret is required}"
          : "${DB_PASSWORD:?DB_PASSWORD secret is required}"

          cd "$SERVER_APP_PATH"

          git fetch --prune origin main
          git checkout main
          git pull --ff-only origin main

          export DOCKER_BUILDKIT=1
          export BUILDKIT_PROGRESS=plain
          export COMPOSE_PROGRESS=plain

          bash docker/deploy-blue-green.sh
          REMOTE
