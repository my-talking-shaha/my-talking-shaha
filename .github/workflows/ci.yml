name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend-team tests and build package
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend lint, build, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install frontend dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Flutter web app
        run: flutter build web --release --dart-define=API_BASE_URL=/api/v1

  android-apk:
    name: Android release APK build
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install frontend dependencies
        run: flutter pub get

      - name: Set Android release version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail

          build_name="${GITHUB_REF_NAME#v}"
          if [[ ! "$build_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the vX.Y.Z format." >&2
            exit 1
          fi

          echo "ANDROID_BUILD_NAME=$build_name" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Prepare Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_BASE64" ] && \
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && \
             [ -z "$ANDROID_KEY_ALIAS" ] && \
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "Android release signing secrets are required for a tag release." >&2
              exit 1
            fi

            exit 0
          fi

          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || \
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ] || \
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android release signing secrets must be configured together." >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/android-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build Android release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_BUILD_NAME:-}" ]; then
            flutter build apk --release \
              --build-name="$ANDROID_BUILD_NAME" \
              --build-number="$ANDROID_BUILD_NUMBER"
          else
            flutter build apk --release
          fi

      - name: Remove Android release signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.keystore"

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: my-talking-shaha-release-apk-${{ github.sha }}
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  publish-apk-release:
    name: Publish Android APK to GitHub Releases
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - backend
      - frontend
      - android-apk
      - docker-smoke-test
      - deployment-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Android release APK
        uses: actions/download-artifact@v4
        with:
          name: my-talking-shaha-release-apk-${{ github.sha }}
          path: release-assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/app-release.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/app-release.apk --generate-notes --verify-tag
          fi

  docker-smoke-test:
    name: Application Docker smoke test
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DB_USERNAME: ci_shaha_user
      DB_PASSWORD: ci-db-password-32-bytes
      JWT_SECRET: ci-jwt-secret-with-more-than-32-bytes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start application stack
        env:
          DOCKER_BUILDKIT: 1
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml up -d --build --remove-orphans backend frontend router

      - name: Wait for backend health
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              exit 0
            fi

            echo "Backend is not healthy yet, retry $attempt/30"
            sleep 5
          done

          echo "Backend did not become healthy in time" >&2
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml ps postgres backend frontend router
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml logs --no-color postgres backend frontend router
          exit 1

      - name: Wait for frontend health
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl -fsS http://localhost/health; then
              exit 0
            fi

            echo "Frontend is not healthy yet, retry $attempt/30"
            sleep 5
          done

          echo "Frontend router did not become healthy in time" >&2
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml ps postgres backend frontend router
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml logs --no-color postgres backend frontend router
          exit 1

      - name: Verify OpenAPI docs
        run: curl -fsS http://localhost/v3/api-docs >/dev/null

      - name: Verify Swagger UI
        run: |
          set -euo pipefail

          curl -fsS http://localhost/swagger-ui.html | grep -q "SwaggerUIBundle"
          curl -fsS http://localhost/webjars/swagger-ui/5.32.2/swagger-ui.css | grep -q "swagger-ui"

      - name: Verify API data flow through nginx
        run: |
          set -euo pipefail

          smoke_email="smoke-$(date +%s)@example.com"
          token="$(curl -fsS -X POST http://localhost/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            --data "{\"email\": \"$smoke_email\", \"password\": \"secret123\", \"displayName\": \"Smoke Test\"}" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["accessToken"])')"
          auth_header="Authorization: Bearer $token"

          vehicle_response="$(curl -fsS -X POST http://localhost/api/v1/vehicles \
            -H "$auth_header" \
            -H 'Content-Type: application/json' \
            --data '{
              "brand": "Smoke",
              "model": "Runner",
              "productionYear": 2002,
              "mileageKm": 10000,
              "fuelType": "GASOLINE",
              "engineDescription": "1.6 L",
              "vin": "XTA21060000000001"
            }')"
          vehicle_id="$(printf '%s' "$vehicle_response" | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')"

          curl -fsS http://localhost/api/v1/vehicles \
            -H "$auth_header" \
            | python3 -c 'import json, sys; vehicle_id = sys.argv[1]; vehicles = json.load(sys.stdin); assert any(vehicle.get("id") == vehicle_id for vehicle in vehicles), "created vehicle is missing from garage list"' "$vehicle_id"

          curl -fsS -X POST "http://localhost/api/v1/vehicles/$vehicle_id/timeline/refuel" \
            -H "$auth_header" \
            -H 'Content-Type: application/json' \
            --data '{
              "eventDateTime": "2026-06-12T14:30:00Z",
              "title": "CI Smoke Refuel",
              "mileageKm": 10000,
              "liters": 40,
              "cost": 3200,
              "fuelType": "GASOLINE",
              "fuelName": "AI-95",
              "stationName": "CI Smoke Station"
            }' >/dev/null

          curl -fsS "http://localhost/api/v1/vehicles/$vehicle_id/analytics?period=ALL_TIME" \
            -H "$auth_header" \
            | python3 -c 'import json, sys; from decimal import Decimal; data = json.load(sys.stdin); assert data["period"] == "ALL_TIME"; assert Decimal(str(data["totalExpenses"])) == Decimal("3200"); assert Decimal(str(data["expensesByCategory"]["FUEL"])) == Decimal("3200"); assert data["historyAnalysis"]["refuelCount"] == 1; assert data["hasData"] is True'

      - name: Dump application stack logs
        if: always()
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml logs --no-color postgres backend frontend router || true

      - name: Stop application stack
        if: always()
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml down --remove-orphans

  deployment-runtime:
    name: Deployment runtime validation
    needs: docker-smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_USERNAME: ci_shaha_user
      DB_PASSWORD: ci-db-password-32-bytes
      JWT_SECRET: ci-jwt-secret-with-more-than-32-bytes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate image-only deployment runtime
        env:
          BACKEND_IMAGE: ghcr.io/example/backend:0123456789abcdef
          FRONTEND_IMAGE: ghcr.io/example/frontend:0123456789abcdef
          DEPLOY_STATE_DIR: /tmp/talking-shaha-deploy-state
        run: |
          set -euo pipefail

          bash -n docker/deploy-blue-green.sh

          if grep -Eq '^[[:space:]]*build:' docker/docker-compose.blue-green.yml; then
            echo 'Blue-green deployment runtime must not build images.' >&2
            exit 1
          fi

          docker compose -f docker/docker-compose.blue-green.yml config -q

  publish-images:
    name: Publish deployment images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - frontend
      - docker-smoke-test
      - deployment-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/my-talking-shaha-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image
          provenance: mode=max
          sbom: true

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/my-talking-shaha-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image
          provenance: mode=max
          sbom: true
