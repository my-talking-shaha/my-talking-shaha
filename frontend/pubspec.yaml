name: frontend
description: "My talking shaha"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  dio: ^5.9.2
  flutter_svg: ^2.3.0
  flutter_secure_storage: ^10.3.1
  logger: ^2.7.0
  flutter_riverpod: ^3.3.2
  image_picker: ^1.2.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_secure_storage_platform_interface: ^2.0.1
  shared_preferences_platform_interface: ^2.4.2
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter_native_splash:
  color: "#000006"
  image_ios: assets/images/splash.png
  ios_content_mode: scaleAspectFill
  web: false
  android_12:
    color: "#000006"
    image: assets/images/android_splash.png
    icon_background_color: "#000006"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true

flutter:
  generate: true
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
  - assets/images/
  - assets/icons/
  - assets/icons/garage/
  - assets/icons/navigation/
  - assets/icons/events/
  - assets/icons/parts/
  - assets/icons/auth/
  
