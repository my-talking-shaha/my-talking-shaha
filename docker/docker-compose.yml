version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: talking-shaha-db
    environment:
      POSTGRES_DB: ${DB_NAME:-talking_shaha}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - talking-shaha-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: talking-shaha-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JAVA_OPTS: -Xmx512m -Xms256m
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-talking_shaha}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TIMEWEB_AI_BASE_URL: ${TIMEWEB_AI_BASE_URL:-}
      TIMEWEB_AI_TOKEN: ${TIMEWEB_AI_TOKEN:-}
      TIMEWEB_AI_MODEL: ${TIMEWEB_AI_MODEL:-timeweb-agent}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talking-shaha-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: talking-shaha-frontend
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - talking-shaha-network
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health | grep -q healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  router:
    image: nginx:alpine
    container_name: talking-shaha-router
    ports:
      - "80:80"
    volumes:
      - ./router.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - talking-shaha-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health | grep -q healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  talking-shaha-network:
    driver: bridge

volumes:
  postgres-data:
